<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Created by immersia"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>Immersia POS</title>

    <!-- ── Meta Pixel ──────────────────────────────────────────────────────
         The pixel ID comes from REACT_APP_META_PIXEL_ID at build time, so dev
         and staging builds (which leave it unset) never pollute production
         data. Only the loader lives here — PageView is fired from React on
         every route change, since this is a SPA and a hard load happens once.
    -->
    <script>
      (function () {
        var pixelId = '%REACT_APP_META_PIXEL_ID%';
        // CRA leaves the placeholder untouched when the variable is not set.
        if (!pixelId || pixelId.charAt(0) === '%') return;

        window.__META_PIXEL_ID__ = pixelId;

        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');

        fbq('init', pixelId);
      })();
    </script>

    <noscript>
      <img height="1" width="1" style="display:none" alt=""
      src="https://www.facebook.com/tr?id=%REACT_APP_META_PIXEL_ID%&ev=PageView&noscript=1"/>
    </noscript>
    <!-- ── End Meta Pixel ─────────────────────────────────────────────────── -->

  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
